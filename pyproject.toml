[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scoped-omem"
version = "0.1.1"
description = "Scoped, auditable, append-only memory for coding agents"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
memory = "omem.cli:main"

[tool.setuptools]
packages = ["omem"]

[tool.setuptools.package-data]
omem = ["INSTRUCTIONS.md", "SESSION_REVIEW.md"]
