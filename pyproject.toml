[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "scoped-omem"
version = "0.1.1"
description = "Scoped, auditable, append-only memory for coding agents"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["agents", "codex", "memory"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/voxmenthe/omem"
Repository = "https://github.com/voxmenthe/omem"
Issues = "https://github.com/voxmenthe/omem/issues"

[project.scripts]
memory = "omem.cli:main"

[tool.setuptools]
packages = ["omem"]

[tool.setuptools.package-data]
omem = ["INSTRUCTIONS.md", "SESSION_REVIEW.md"]
