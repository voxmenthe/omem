# OMem Codex integration: two read-only hook routes plus the host binding.
# Merge into your Codex configuration; never replace unrelated settings.

[shell_environment_policy.set]
OMEM_HOST = "codex"

[[hooks.UserPromptSubmit]]

[[hooks.UserPromptSubmit.hooks]]
type = "command"
command = "memory codex-hook"
timeout = 3
statusMessage = "Loading memory turn context"
# Codex counts approximate tokens; OMem separately caps output at 4,096 bytes.
additionalContextLimit = 4096

[[hooks.SessionStart]]
matcher = "^compact$"

[[hooks.SessionStart.hooks]]
type = "command"
command = "memory codex-hook"
timeout = 3
statusMessage = "Loading memory recovery checkpoint"
additionalContextLimit = 800
