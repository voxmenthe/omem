# hist configuration: copy to ~/.hist/config.toml and edit the roots.
# Transcript locations come only from this file. Roots may not overlap, and
# roots that do not exist are skipped.

[[sources]]                        # one entry per host installation or account
adapter = "codex"
label = "codex"                    # shown in message headers and `hist status`
roots = ["~/.codex"]               # add any other CODEX_HOME of the same account

# [[sources]]                      # a second Codex account in its own CODEX_HOME
# adapter = "codex"
# label = "codex2"
# roots = ["~/.codex2"]

[[sources]]
adapter = "claude"
label = "claude"
roots = ["~/.claude/projects"]

[discovery]
# Scanned only to report session stores that no source claims.
watch = ["~/.codex*", "~/.claude*", "~/.kimi*", "~/.local/share/opencode", "~/.gemini/antigravity"]
exclude = []                       # paths or repositories never indexed

[view]
bytes = 8000
worker = "header"                  # what a worker gets at start: header, view, or none
inject = []                        # repositories (timeline names) shown the view; or "all"

[summaries]
# Without a command, views use outlines. Backends: claude, codex, devin,
# opencode, anthropic, openai, or any hist-summarize/1 command (hist/README.md).
# command = ["hist", "summarize", "claude"]
timelines = []                     # timelines opted in to model-written summaries
max_concurrency = 4
max_attempts_per_day = 2000
